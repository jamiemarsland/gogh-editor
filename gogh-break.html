<div class="wp-block-gogh-section alignfull gogh-wrap"><style class="gogh-style">/* generated by gogh */
.gogh-wrap { container-type: inline-size; margin-block: 0 !important; min-width: 100%; }
.gogh-section.gogh-sec-2 {
  display: grid;
  position: relative;

  background: var(--wp--preset--color--contrast, #16181c);
  grid-template-columns: 20cqw 7.5cqw 13.67cqw 17.67cqw 13.67cqw 7.5cqw 20cqw;
  grid-template-rows:
    minmax(5.83cqw, max-content)
    minmax(3.67cqw, max-content)
    minmax(3cqw, max-content)
    minmax(3.75cqw, max-content)
    minmax(7.08cqw, max-content)
    minmax(3.75cqw, max-content)
    minmax(9.58cqw, max-content);
}
.gogh-section.gogh-sec-2 > * { margin: 0 !important; min-width: 0; box-sizing: border-box; }
.gogh-section.gogh-sec-2 > .wp-block-group { padding: 0 !important; }
.gogh-section.gogh-sec-2 .gogh-el-1 { grid-area: 2 / 4 / 3 / 5; z-index: 1; display: flex; align-items: center; min-width: max-content; gap: 0.6em; height: 100%; background: #fff; color: #141519; border-radius: clamp(6px, 1.2cqw, 14px); padding: 0 1.1em; font-size: clamp(11px, 1.15cqw, 14px); font-weight: 600; box-shadow: 0 14px 34px -12px rgba(0,0,0,0.55); white-space: nowrap; }
.gogh-section.gogh-sec-2 .gogh-el-2 { color: var(--wp--preset--color--base, #fff) !important; }
.gogh-section.gogh-sec-2 .gogh-el-2 { grid-area: 4 / 2 / 5 / 7; z-index: 2; align-self: start; text-align: center; }
.gogh-section.gogh-sec-2 .gogh-el-3 { color: color-mix(in srgb, var(--wp--preset--color--base, #fff) 75%, transparent) !important; }
.gogh-section.gogh-sec-2 .gogh-el-3 { grid-area: 6 / 3 / 7 / 6; z-index: 3; align-self: start; text-align: center; }
.gogh-section.gogh-sec-2 .gogh-badge::before { content: "★"; width: 1.9em; height: 1.9em; flex: none; border-radius: 50%; background: #e8b04b; display: grid; place-items: center; color: #141519; }

.gogh-section.gogh-sec-2 .wp-block-button__link { display: flex; align-items: center; justify-content: center; box-sizing: border-box; white-space: nowrap; }
.gogh-section.gogh-sec-2 .gogh-ghost .wp-block-button__link { background: transparent; color: inherit; box-shadow: inset 0 0 0 1.5px currentColor; }

@container (max-width: 700px) {
