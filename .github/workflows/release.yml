# Cut a GitHub Release with a countable plugin zip whenever a v* tag is
# pushed. Release-asset downloads are the only downloads GitHub tracks —
# repo/branch zips are invisible. Usage:
#   git tag v0.83.0 && git push origin v0.83.0
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package plugin zip (honours .distignore)
        run: |
          mkdir -p /tmp/pkg/gogh
          rsync -a --exclude-from=.distignore ./ /tmp/pkg/gogh/
          cd /tmp/pkg && zip -rq gogh.zip gogh
      - name: Create release with asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" /tmp/pkg/gogh.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Gogh ${GITHUB_REF_NAME}" \
            --generate-notes
