# Cut a GitHub Release with a countable plugin zip whenever a v* tag is
# pushed. Release-asset downloads are the only downloads GitHub tracks —
# repo/branch zips are invisible. Usage:
#   git tag v0.83.0 && git push origin v0.83.0
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # knowledge step diffs against the previous tag
      - name: Package plugin zips (honours .distignore)
        run: |
          mkdir -p /tmp/pkg/gogh
          rsync -a --exclude-from=.distignore ./ /tmp/pkg/gogh/
          cd /tmp/pkg && zip -rq gogh.zip gogh
          cd -
          # the playground zip carries demo-assets too: the Yellow House
          # starter and boot read the paintings and logo from the plugin
          # directory. Separate asset name also keeps download counters
          # split between demo boots and real installs.
          rsync -a ./demo-assets/ /tmp/pkg/gogh/demo-assets/
          cd /tmp/pkg && zip -rq gogh-playground.zip gogh
      - name: Build helper knowledge (feeds the Gogh Helper bot)
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          python3 - "$PREV" <<'PY'
          import json, re, subprocess, sys, datetime
          prev = sys.argv[1]
          rng = (prev + '..HEAD') if prev else 'HEAD'
          log = subprocess.run(['git', 'log', rng, '--pretty=%s%n%b%n---'],
                               capture_output=True, text=True).stdout
          tests = re.findall(r"test\('([^']+)'", open('gogh-tests.js').read())
          out = {
            'version': subprocess.run(['git', 'describe', '--tags'], capture_output=True, text=True).stdout.strip(),
            'released': datetime.date.today().isoformat(),
            'changelog_since': prev or 'start',
            'changelog': [c.strip() for c in log.split('---') if c.strip()],
            'behaviours_under_test': tests,
          }
          json.dump(out, open('/tmp/pkg/knowledge.json', 'w'), indent=1)
          print('knowledge:', len(out['changelog']), 'changes,', len(tests), 'tested behaviours')
          PY
      - name: Create release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" /tmp/pkg/gogh.zip /tmp/pkg/gogh-playground.zip /tmp/pkg/knowledge.json \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Gogh ${GITHUB_REF_NAME}" \
            --generate-notes
      - name: Nudge the helper to rebuild its knowledge
        if: ${{ vars.GOGH_HELPER_REBUILD_URL != '' }}
        run: |
          curl -fsS -X POST "${{ vars.GOGH_HELPER_REBUILD_URL }}" \
            -H 'Content-Type: application/json' \
            -d "{\"version\":\"${GITHUB_REF_NAME}\",\"knowledge\":\"https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/knowledge.json\"}" \
            || echo "helper nudge failed (non-fatal)"

  # ------------------------------------------------------------- demo sync
  # The public face updates itself: gogh-demo (blueprint, boot, zip, KB)
  # is refreshed as ONE amended commit per release — no history, no
  # cadence — and the hosted helper is told to re-read its knowledge.
  # Needs: DEMO_SYNC_KEY (write deploy key on gogh-demo) and
  # HELPER_REFRESH_TOKEN (the Worker's refresh secret).
  demo-sync:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # regenerate the KB from THIS tag's source — the committed copy
      # always trails by one release (kb.yml refreshes it after tagging)
      - name: Rebuild the knowledge base
        run: |
          set +e
          python3 helper/refresh.py
          code=$?
          [ "$code" = "2" ] && echo "::warning::extractor broke — shipping the committed KB instead"
          exit 0
      - name: Sync gogh-demo and wake the helper
        env:
          GH_TOKEN: ${{ github.token }}
          DEMO_SYNC_KEY: ${{ secrets.DEMO_SYNC_KEY }}
          REFRESH_TOKEN: ${{ secrets.HELPER_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && echo "$DEMO_SYNC_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern gogh-playground.zip --dir /tmp
          git clone --depth 1 git@github.com:jamiemarsland/gogh-demo.git /tmp/demo
          cp /tmp/gogh-playground.zip blueprint.json blueprint-experiments.json blueprint-paste.json demo-boot.php demo-boot-woo.php demo-boot-paste.php helper/gogh-kb.md /tmp/demo/
          cd /tmp/demo
          git config user.name "Jamie Marsland"
          git config user.email "jamiemarsland@pootlepress.co.uk"
          git add -A
          git commit --amend -m "gogh demo — ${GITHUB_REF_NAME}"
          git push --force origin main
          # raw's CDN can hold the old file briefly — wait for the new
          # version string before waking the helper, so it never drinks stale
          for i in $(seq 1 30); do
            if curl -fsS "https://raw.githubusercontent.com/jamiemarsland/gogh-demo/main/gogh-kb.md" | grep -q "${GITHUB_REF_NAME#v}"; then break; fi
            sleep 20
          done
          # raw's edges disagree for a while after a force-push: the runner
          # can see the new file while the worker's edge still serves the
          # old one. Ping until the helper actually reports this release.
          for i in $(seq 1 10); do
            out=$(curl -fsS -X POST "https://gogh-helper.jamesmarsland.workers.dev/api/refresh" \
              -H "x-refresh-token: ${REFRESH_TOKEN}" 2>/dev/null) || out=""
            echo "helper: $out"
            echo "$out" | grep -q "\"pluginVersion\":\"${GITHUB_REF_NAME#v}\"" && break
            sleep 30
          done
